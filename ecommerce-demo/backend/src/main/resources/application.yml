spring:
  application:
    name: ecommerce-backend
  datasource:
    url: ${ECOMMERCE_DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${ECOMMERCE_DB_USERNAME:postgres}
    password: ${ECOMMERCE_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${ECOMMERCE_SERVER_PORT:8080}
